[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2scene"
version = "0.5.0"
description = "AI-powered auto video editor — data.json → Remotion project. 100% offline."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Kelvin Yuli Andrian" }]
requires-python = ">=3.9"
keywords = [
    "audio", "music", "structure", "segmentation", "dsp", "librosa",
    "offline", "remotion", "video", "editor", "typography", "shadcn",
    "remocn", "auto-editor", "tiktok",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
audio2scene = "audio2scene.cli:main"

[project.urls]
Homepage = "https://github.com/kelvinzer0/audio2scene"
Repository = "https://github.com/kelvinzer0/audio2scene"
Documentation = "https://github.com/kelvinzer0/audio2scene#readme"
Issues = "https://github.com/kelvinzer0/audio2scene/issues"

# Include template files (.tsx, .ts, .d.ts) in the package
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
audio2scene = [
    "templates/*",
    "templates/**/*",
    "*.tsx",
    "*.ts",
    "*.d.ts",
]

[tool.setuptools.packages.find]
include = ["audio2scene*"]
