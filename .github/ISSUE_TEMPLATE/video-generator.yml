name: 🎬 Video Generator
description: Generate a video from data.json spec — music + text + images + videos
title: "[VIDEO] <judul video kamu>"
labels: ["video-request"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🎬 Auto Video Generator
        
        Isi form di bawah untuk generate video otomatis. Video akan dirender oleh CI
        dan di-upload sebagai artifact (download link di issue comment).
        
        **Semua field support URL atau local path.** Untuk file upload, upload ke
        [Pixabay](https://pixabay.com), [Unsplash](https://unsplash.com), atau hosting
        lain dan paste URL-nya.
        
        ---
        
  - type: dropdown
    id: trending_music
    attributes:
      label: 🔥 Trending TikTok Music
      description: |
        Pilih dari lagu TikTok trending Indonesia (updated: 2026-07-04).
        Kalau pilih lagu di sini, TIDAK perlu isi Music URL di bawah.
      options:
        - 🚫 Tidak pakai trending — saya punya URL sendiri
        - 1. kamu salah orang — AULIA RIZKI (2.7M)
        - 2. Ai Quero Bomba — JOKER ZEVEDO (2.4M)
        - 3. Garam & Madu (Sakit Dadaku) — Tenxi, Jemsii & Naykilla (1.1M)
        - 4. Don't Get The Wrong Partner — Elissa Heuntet (913K)
        - 5. - — Fadhilah Intan (227K)
        - 6. Demi Cinta Nih Yee… — Hetty Koes Endang (161K)
        - 7. Bahara (From "I Hate Luv Storys") — Shreya Ghoshal, Sona Mohapatra (35K)

    validations:
      required: true

  - type: input
    id: music
    attributes:
      label: 🎵 Music URL (skip kalau pilih trending di atas)
      description: |
        URL ke file audio (MP3/WAV/FLAC). 
        SKIP field ini kalau sudah pilih trending music di atas.
        
        ⚠️ GitHub issue TIDAK support upload MP3 langsung. Opsi:
        - [archive.org](https://archive.org) — free, permanent
        - [Pixabay Music](https://pixabay.com/music/) — free, direct MP3 URL
        - GitHub Release — upload MP3 ke release, copy download URL
        - Fork repo → tambah MP3 ke folder `uploads/` → create PR
      placeholder: "https://archive.org/download/.../song.mp3  (atau biarkan kosong kalau pilih trending)"
    validations:
      required: false

  - type: input
    id: screen
    attributes:
      label: 📐 Screen Resolution
      description: Format W:H. 1080:1920 = TikTok/Reels (vertical), 1280:720 = YouTube (horizontal), 1080:1080 = Instagram (square)
      placeholder: "1080:1920"
    validations:
      required: true

  - type: input
    id: duration
    attributes:
      label: ⏱️ Duration
      description: Durasi video. 30 = 30 detik, "2m" = 2 menit, "90s" = 90 detik
      placeholder: "30s"
    validations:
      required: true

  - type: input
    id: font
    attributes:
      label: 🔤 Font (Google Fonts)
      description: Nama font dari Google Fonts
      placeholder: "Inter"
    validations:
      required: false

  - type: input
    id: logo
    attributes:
      label: 🏢 Logo URL
      description: |
        URL ke logo (PNG/SVG). Akan animasi di intro scene.
        Kalau ada logo, text scene pertama otomatis skip.
        
        Sumber logo gratis:
        - [Unsplash](https://unsplash.com) — search "logo"
        - [Pixabay](https://pixabay.com/images/search/logo/)
        - Brand fetcher: `https://logo.clearbit.com/example.com`
      placeholder: "https://logo.clearbit.com/example.com  (atau https://images.unsplash.com/photo-XXXX.png)"
    validations:
      required: false

  - type: input
    id: symbol
    attributes:
      label: 🔖 Symbol/Favicon URL
      description: |
        URL ke favicon/icon (PNG/SVG). Watermark di pojok semua scene.
        
        Sumber icon gratis:
        - [Favicon.io](https://favicon.io/) — generate dari text/emoji
        - [IconFinder](https://www.iconfinder.com/search?type=free) — filter "Free"
        - [Flaticon](https://www.flaticon.com/) — free with attribution
      placeholder: "https://favicon.io/favicon.ico  (atau https://cdn.example.com/icon.png)"
    validations:
      required: false

  - type: textarea
    id: text
    attributes:
      label: ✏️ Text Scenes (required)
      description: |
        Satu baris = satu scene. Efek typography dipilih otomatis berdasarkan konten.
        
        Tips untuk trigger efek spesifik:
        - Tanya "?" → typewriter effect
        - Angka saja "2024" → slot machine
        - 3 kata + 3 titik "Fast. Crisp. Fluid." → spring scale
        - Kata sambung "for/untuk/dari" → marker highlight
        - UPPERCASE "HELLO" → RGB glitch
      placeholder: |
        My Brand Name
        Are you ready?
        2024
        Fast. Crisp. Fluid.
        Thanks for watching
    validations:
      required: true

  - type: textarea
    id: videos
    attributes:
      label: 🎥 Video URLs (B-roll)
      description: |
        Satu URL per baris. Video akan alternate dengan images per scene.
        Format MP4/WebM/MOV. Boleh biarkan kosong kalau cuma pakai images.
        
        **Sumber video gratis (Direct MP4 URL):**
        - [Pixabay Videos](https://pixabay.com/videos/) → klik video → "Download" → copy URL
        - [Coverr](https://coverr.co/) → free stock videos, no attribution
        - [Pexels Videos](https://www.pexels.com/videos/) → free, register to download
        - [Archive.org](https://archive.org/details/movies) → public domain films
        
        **Contoh placeholder yang SUDAH berfungsi (bisa langsung dipakai untuk test):**
      placeholder: |
        # — Contoh URL video yang sudah berfungsi (boleh dipakai langsung) —
        https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4
        https://www.w3schools.com/html/mov_bbb.mp4
        # — Setelah ini, ganti/ganti-tambah URL video kamu sendiri —
        # https://cdn.pixabay.com/video/your-clip.mp4
    validations:
      required: false

  - type: textarea
    id: images
    attributes:
      label: 🖼️ Image URLs (background)
      description: |
        Satu URL per baris. Images akan alternate dengan videos per scene.
        Format JPG/PNG/WebP. Boleh biarkan kosong kalau cuma pakai videos.
        
        **Sumber image gratis (Direct URL):**
        - [Unsplash](https://unsplash.com) → klik photo → copy URL (atau pakai `?w=1920`)
        - [Pixabay Images](https://pixabay.com/images/) → klik photo → "Download" → copy URL
        - [Pexels](https://www.pexels.com/search/photos/) → free, no attribution
        - [Lorem Picsum](https://picsum.photos/) → random photo, `https://picsum.photos/1920/1080`
        
        **Tips portrait (TikTok/Reels 1080×1920):** pakai `?w=1080` di Unsplash
        untuk dapat resolusi yang pas. Image akan di-blur-fill otomatis biar gak ada
        black bar di mode portrait.
        
        **Contoh placeholder yang SUDAH berfungsi (bisa langsung dipakai untuk test):**
      placeholder: |
        # — Contoh URL image yang sudah berfungsi (boleh dipakai langsung) —
        https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1920
        https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920
        https://images.unsplash.com/photo-1518602164578-cd0074062767?w=1080
        https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Camponotus_flavomarginatus_ant.jpg/1280px-Camponotus_flavomarginatus_ant.jpg
        # — Setelah ini, ganti/ganti-tambah URL image kamu sendiri —
        # https://cdn.pixabay.com/photo/your-bg.jpg
    validations:
      required: false

  - type: dropdown
    id: quality
    attributes:
      label: 🎯 Render Quality
      description: Higher quality = larger file + longer render time
      options:
        - Fast (320×180, ~2 min render)
        - Standard (640×360, ~5 min render)
        - HQ (1280×720, ~15 min render)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        
        ### 📋 What happens next?
        
        1. CI akan parse issue ini jadi `data.json`
        2. Download semua URL (music, videos, images, logo, symbol)
        3. Analyze music structure (beats, segments, intensity)
        4. Generate Remotion project dengan 36 typography components
        5. Render MP4
        6. Upload artifact + comment download link di issue ini
        
        ⏱️ Estimasi waktu: 2-15 menit tergantung quality + duration
        
        ---
        
        ### 💡 Tips Cepat
        
        - **Pakai placeholder yang sudah ada** di kolom `videos` dan `images` kalau
          cuma mau test render. URLs-nya sudah diverifikasi berfungsi.
        - **Hapus baris yang diawali `#`** sebelum submit — itu cuma komentar
          bantuan, parser akan skip baris komentar otomatis.
        - **Alternating otomatis**: kalau kamu isi 2 video + 3 image, hasilnya
          akan `video → image → video → image → image` per scene.
