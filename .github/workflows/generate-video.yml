name: 🎬 Video Generator

on:
  issues:
    types: [opened, reopened]

jobs:
  generate-video:
    # Only run on issues with "video-request" label
    if: contains(github.event.issue.labels.*.name, 'video-request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: write
      actions: read

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install audio2scene
        run: |
          pip install -e .
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 💬 Comment — started
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '🎬 **Video generation started!**',
                '',
                '⏱️ Estimasi: 2-10 menit',
                `🔗 [View progress](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              ].join('\n')
            });

      - name: 📝 Parse issue body → data.json
        id: parse
        run: |
          cat > /tmp/issue-body.txt << 'ISSUE_EOF'
          ${{ github.event.issue.body }}
          ISSUE_EOF

          python3 scripts/issue_to_datajson.py \
            --issue-body /tmp/issue-body.txt \
            --output /tmp/data.json

          RENDER_SCALE=$(cat .render-scale)
          echo "render_scale=$RENDER_SCALE" >> $GITHUB_OUTPUT

      - name: 🎬 Generate + Render video
        id: render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          audio2scene generate-remotion \
            --input /tmp/data.json \
            --output ./my-video \
            --render --scale ${{ steps.parse.outputs.render_scale }} 2>&1 || {
              echo "render_failed=true" >> $GITHUB_OUTPUT
              exit 0
            }
          echo "render_failed=false" >> $GITHUB_OUTPUT
          ls -la ./my-video/out/video.mp4 2>/dev/null || echo "No video.mp4 found"

      - name: 📤 Upload MP4 to GitHub Release
        id: upload
        if: steps.render.outputs.render_failed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="video-issue-${{ github.event.issue.number }}"

          # Create release (or update if exists)
          gh release create "$TAG" \
            --title "Video Issue #${{ github.event.issue.number }}" \
            --notes "Auto-generated video" \
            --repo ${{ github.repository }} 2>/dev/null || true

          # Upload MP4 as release asset (overwrite if exists)
          gh release upload "$TAG" ./my-video/out/video.mp4 \
            --repo ${{ github.repository }} --clobber

          # Direct public download URL
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/video.mp4"
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "✓ Video uploaded: $DOWNLOAD_URL"

      - name: 💬 Comment — success
        if: steps.render.outputs.render_failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const downloadUrl = '${{ steps.upload.outputs.download_url }}';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '🎬 **Video ready!** ✅',
                '',
                '📹 **Download:** [video.mp4](' + downloadUrl + ')',
                '',
                '⬇️ Direct link:',
                '```',
                downloadUrl,
                '```',
                '',
                '---',
                `_Scale: ${{ steps.parse.outputs.render_scale }} | Issue #${{ github.event.issue.number }}_`
              ].join('\n')
            });

      - name: 💬 Comment — failed
        if: steps.render.outputs.render_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '❌ **Video generation failed!**',
                '',
                'Check [workflow logs](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')',
                '',
                'Common issues:',
                '- Music URL tidak valid / expired',
                '- Duration terlalu panjang (coba "15s")',
                '- Pilih trending music dari dropdown (URL persistent)'
              ].join('\n')
            });

      - name: 🏷️ Close issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
