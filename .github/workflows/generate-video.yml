name: 🎬 Video Generator

on:
  issues:
    types: [opened, reopened]

jobs:
  generate-video:
    if: contains(github.event.issue.labels.*.name, 'video-request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: read

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install audio2scene
        run: |
          pip install -e .
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 💬 Comment — started
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎬 **Video generation started!**\n\n⏱️ Estimasi: 2-5 menit\n🔗 [View progress](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            });

      - name: 📝 Parse issue body → data.json
        id: parse
        run: |
          printf '%s' '${{ github.event.issue.body }}' > /tmp/issue-body.txt
          python3 scripts/issue_to_datajson.py \
            --issue-body /tmp/issue-body.txt \
            --output /tmp/data.json
          RENDER_SCALE=$(cat .render-scale)
          echo "render_scale=$RENDER_SCALE" >> $GITHUB_OUTPUT

      - name: 🎬 Generate + Render video
        id: render
        run: |
          audio2scene generate-remotion \
            --input /tmp/data.json \
            --output ./my-video \
            --render --scale ${{ steps.parse.outputs.render_scale }} 2>&1 || {
              echo "render_failed=true" >> $GITHUB_OUTPUT
              exit 0
            }
          echo "render_failed=false" >> $GITHUB_OUTPUT
          
          # Verify file exists
          echo "=== Checking output ==="
          ls -la ./my-video/out/video.mp4 2>&1 || echo "File not found!"
          find ./my-video -name "*.mp4" 2>/dev/null

      - name: 📦 Upload MP4 artifact
        id: artifact
        if: steps.render.outputs.render_failed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.issue.number }}
          path: ./my-video/out/video.mp4
          retention-days: 30

      - name: 💬 Comment — success
        if: steps.render.outputs.render_failed != 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '🎬 **Video ready!** ✅',
                '',
                '📹 **Download video:**',
                '',
                '1. Buka link: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                '2. Scroll ke bawah → **Artifacts** section',
                '3. Klik **video-' + context.issue.number + '** untuk download',
                '',
                '⏳ Artifact tersedia 30 hari',
                '',
                '---',
                `_Quality: ${{ steps.parse.outputs.render_scale }} | Issue #${{ github.event.issue.number }}_`
              ].join('\n')
            });

      - name: 💬 Comment — failed
        if: failure() || steps.render.outputs.render_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '❌ **Video generation failed!**',
                '',
                'Check [logs](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')',
                '',
                'Tips:',
                '- Pilih trending music dari dropdown',
                '- Duration pendek: "15s"',
                '- Quality: Fast'
              ].join('\n')
            });

      - name: 🏷️ Close issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
