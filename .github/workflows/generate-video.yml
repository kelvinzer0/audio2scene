name: 🎬 Video Generator

on:
  issues:
    types: [opened, reopened]

jobs:
  generate-video:
    if: contains(github.event.issue.labels.*.name, 'video-request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: write

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install audio2scene
        run: |
          pip install -e .
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 💬 Comment — started
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎬 **Video generation started!**\n\n⏱️ Estimasi: 2-5 menit\n🔗 [View progress](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            });

      - name: 📝 Parse issue body → data.json
        id: parse
        run: |
          printf '%s' '${{ github.event.issue.body }}' > /tmp/issue-body.txt
          python3 scripts/issue_to_datajson.py \
            --issue-body /tmp/issue-body.txt \
            --output /tmp/data.json
          RENDER_SCALE=$(cat .render-scale)
          echo "render_scale=$RENDER_SCALE" >> $GITHUB_OUTPUT

      - name: 🎬 Generate + Render video
        id: render
        run: |
          audio2scene generate-remotion \
            --input /tmp/data.json \
            --output ./my-video \
            --render --scale ${{ steps.parse.outputs.render_scale }} 2>&1 || {
              echo "render_failed=true" >> $GITHUB_OUTPUT
              exit 0
            }
          echo "render_failed=false" >> $GITHUB_OUTPUT
          ls -la ./my-video/out/video.mp4 2>&1

      - name: 📤 Push MP4 to gh-pages (direct download URL)
        id: upload
        if: steps.render.outputs.render_failed != 'true'
        run: |
          # Clone gh-pages, copy MP4, push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p videos
          cp ./my-video/out/video.mp4 "videos/issue-${{ github.event.issue.number }}.mp4"
          git add "videos/issue-${{ github.event.issue.number }}.mp4"
          git commit -m "video: issue #${{ github.event.issue.number }}"
          git push origin gh-pages
          
          # Direct public URL via GitHub Pages
          VIDEO_URL="https://kelvinzer0.github.io/audio2scene/videos/issue-${{ github.event.issue.number }}.mp4"
          echo "video_url=$VIDEO_URL" >> $GITHUB_OUTPUT
          echo "✓ Video pushed: $VIDEO_URL"

      - name: 💬 Comment — success with video preview
        if: steps.render.outputs.render_failed != 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const videoUrl = '${{ steps.upload.outputs.video_url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '🎬 **Video ready!** ✅',
                '',
                `📹 **Download MP4:** [video.mp4](${videoUrl})`,
                '',
                `⬇️ Direct link (klik untuk download/play):`,
                `${videoUrl}`,
                '',
                '---',
                `_Quality: ${{ steps.parse.outputs.render_scale }} | Issue #${{ github.event.issue.number }}_`
              ].join('\n')
            });

      - name: 💬 Comment — failed
        if: failure() || steps.render.outputs.render_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '❌ **Video generation failed!**',
                '',
                'Check [logs](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')',
                '',
                'Tips:',
                '- Pilih trending music dari dropdown',
                '- Duration pendek: "15s"',
                '- Quality: Fast'
              ].join('\n')
            });

      - name: 🏷️ Close issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
