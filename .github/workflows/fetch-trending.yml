name: 📊 Fetch Trending Music (Daily)

on:
  schedule:
    # Run every day at 00:00 UTC (07:00 WIB)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📊 Fetch trending music
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python3 scripts/fetch_trending_music.py

      - name: 📝 Update issue template with trending tracks
        run: |
          python3 scripts/update_issue_template.py

      - name: 💾 Commit trending data + updated template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if any file changed
          if git diff --quiet data/trending-music.json .github/ISSUE_TEMPLATE/video-generator.yml 2>/dev/null; then
            echo "No changes — skipping commit"
          else
            git add data/trending-music.json .github/ISSUE_TEMPLATE/video-generator.yml
            git commit -m "chore: daily trending music update + issue template ($(date -u +%Y-%m-%d))"
            git push
            echo "✓ Pushed trending music + template update"
          fi

      - name: 📦 Upload as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: trending-music-$(date -u +%Y-%m-%d)
          path: data/trending-music.json
          retention-days: 90
